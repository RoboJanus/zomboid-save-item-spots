<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#121417"/>
            <stop offset="1" stop-color="#0f1113"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)"/>
    <rect width="100%" height="100%" fill="url(#grid)" opacity="0.6"/>

    <!-- Pin/marker icon -->
    <g transform="translate(256, 180)" fill="none" stroke="#4caf50" stroke-width="3">
        <circle cx="0" cy="0" r="40" fill="#4caf5020"/>
        <line x1="-20" y1="0" x2="20" y2="0"/>
        <line x1="0" y1="-20" x2="0" y2="20"/>
        <circle cx="0" cy="0" r="8" fill="#4caf50"/>
    </g>

    <!-- Title -->
    <text x="256" y="290" text-anchor="middle" font-family="Orbitron, 'Arial Narrow', sans-serif" font-weight="700" font-size="52" fill="#4caf50" style="letter-spacing:1px">
        Save Item Spots
    </text>
    <text x="256" y="330" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#cfe8ff" opacity="0.6">
        Save and restore item placements.
    </text>
</svg>
